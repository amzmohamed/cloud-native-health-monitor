name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: write   # Required to commit GitOps values back to repository

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  security-and-publish:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Vulnerability Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: amrzakaria101/cloud-native-health-monitor:scan

      - name: Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: amrzakaria101/cloud-native-health-monitor:scan
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: amrzakaria101
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::471112875192:role/github-actions-health-monitor-role
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Production Images (Docker Hub & AWS ECR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            amrzakaria101/cloud-native-health-monitor:latest
            amrzakaria101/cloud-native-health-monitor:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-health-monitor:latest
            ${{ steps.login-ecr.outputs.registry }}/cloud-native-health-monitor:${{ github.sha }}

      - name: Update Helm Chart Image Tag and Commit (GitOps)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' charts/health-monitor/values.yaml
          git add charts/health-monitor/values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update image tag to ${{ github.sha }} [skip ci]" && git push origin main)
