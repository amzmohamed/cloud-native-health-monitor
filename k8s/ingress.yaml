apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-monitor-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: monitor.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: health-monitor-svc
                port:
                  number: 8080