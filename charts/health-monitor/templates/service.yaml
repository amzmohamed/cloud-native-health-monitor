apiVersion: v1
kind: Service
metadata:
  name: health-monitor-svc
  labels:
    {{- include "health-monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    {{- include "health-monitor.selectorLabels" . | nindent 4 }}
