apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-monitor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/amzmohamed/cloud-native-health-monitor.git
    targetRevision: main
    path: charts/health-monitor
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
